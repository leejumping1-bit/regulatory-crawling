name: MDSAP scheduled retry

on:
  schedule:
    # GitHub Actions cron is UTC (every 15 minutes; also :00/:15/:30/:45 KST).
    # Runs may be delayed; deadlines are measured from the initial failure.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regulatory-data-update
  cancel-in-progress: false
  queue: max

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Retry MDSAP if due and persist safely
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python scripts/mdsap_retry.py
